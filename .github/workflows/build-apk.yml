name: Build HESAB Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/hesab/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HESAB"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.hesab.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.hesab.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="HESAB"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

         cat > app/src/main/java/com/hesab/app/MainActivity.java <<'EOF'
          package com.hesab.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.ValueCallback;

          public class MainActivity extends Activity {

              private WebView web;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setTextZoom(100);

                  web.setWebViewClient(new WebViewClient());

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                          WebView view,
                          ValueCallback<Uri[]> callback,
                          FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");

                          try {
                              startActivityForResult(
                                  Intent.createChooser(intent, "انتخاب فایل پشتیبان"),
                                  FILE_REQUEST
                              );
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }

                          return true;
                      }
                  });

                  setContentView(web);
                  web.loadUrl("https://mahdi28884-create.github.io/Linda/");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_REQUEST && fileCallback != null) {
                      Uri[] results = null;

                      if (resultCode == Activity.RESULT_OK && data != null
                          && data.getData() != null) {
                          results = new Uri[]{data.getData()};
                      }

                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (fileCallback != null) {
                      fileCallback.onReceiveValue(null);
                      fileCallback = null;
                  }
                  super.onDestroy();
              }
          }
          EOF
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HESAB-APK
          path: app/build/outputs/apk/debug/app-debug.apk
